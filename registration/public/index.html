
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration - CampusConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">CampusConnect</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/events/">Events</a>
            <a href="/register/">Register</a>
            <a href="/dashboard/">Dashboard</a>
        </div>
    </nav>

    <section class="dashboard-header">
        <h1>Event Registration</h1>
        <p>Register for your favourite campus events.</p>
    </section>

    <section class="registration-section">
        <div class="registration-card">
            <h2>Register for an Event</h2>

            <p class="form-description">
                Enter valid student details to register for a campus event.
                All fields are required.
            </p>

            <form id="registrationForm" novalidate>

                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName"
                        placeholder="Enter your full name"
                        minlength="2" maxlength="60" required>
                    <small id="nameHint" class="field-hint">
                        2–60 characters
                    </small>
                </div>

                <div class="form-group">
                    <label for="studentEmail">Email Address</label>
                    <input type="email" id="studentEmail"
                        placeholder="student@example.com" required>
                </div>

                <div class="form-group">
                    <label for="rollNumber">Roll Number</label>
                    <input type="text" id="rollNumber"
                        placeholder="Enter your roll number"
                        minlength="2" maxlength="20" required>
                </div>

                <div class="form-group">
                    <label for="eventSelect">Select Event</label>
                    <select id="eventSelect" required>
                        <option value="">-- Select an Event --</option>
                        <option value="CodeSprint 2026">CodeSprint 2026</option>
                        <option value="Campus Beats">Campus Beats</option>
                        <option value="AI Future Lab">AI Future Lab</option>
                        <option value="Inter College Cricket">Inter College Cricket</option>
                        <option value="Web Development Bootcamp">Web Development Bootcamp</option>
                        <option value="Photography Workshop">Photography Workshop</option>
                    </select>
                </div>

                <button type="submit" class="btn">
                    Register for Event
                </button>
            </form>

            <p id="registrationMessage"
                class="registration-message"
                role="status" aria-live="polite"></p>
        </div>
    </section>

    <footer>
        <p>© 2026 CampusConnect. All rights reserved.</p>
    </footer>

    <script src="js/registration.js"></script>
</body>
</html>
