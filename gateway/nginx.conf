server {
    listen 80;
    server_name localhost;

    location = /events {
        return 301 /events/;
    }

    location = /register {
        return 301 /register/;
    }

    location = /dashboard {
        return 301 /dashboard/;
    }

    location /events/ {
        proxy_pass http://events:80/;
    }

    location /register/ {
        proxy_pass http://registration:80/;
    }

    location /dashboard/ {
        proxy_pass http://dashboard:80/;
    }

    location / {
        proxy_pass http://home:80/;
    }
}